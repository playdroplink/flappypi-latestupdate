    <script>
      // Official Pi SDK Integration
      // Based on https://github.com/pi-apps/pi-sdk-integration-guide.git
      
      window.PiOfficialSDK = {
        // Official Pi SDK Configuration
        config: {
          version: '2.0',
          sandbox: true, // Sandbox mode
          appId: 'flappypi2807',
          apiKey: 'rppe8zs82vn2kmksqmkopg1yiqzqxs0vgcmzbo5e6hqc3zfn5qeexzygbjqn3yd3',
          validationKey: '94e29cc9c70b87c8fc91e496ac630d23664bff7082cca3ad9d6466bba1aa2902caa46a8eb82a64437d272dbcd329c763679c85cfcba91b95e6fb5b4a6f17b2ce',
          network: 'mainnet',
          // Official Pi SDK settings
          enablePayments: true,
          enableAds: true,
          enableMetadata: true
        },
        
        // Initialize Pi SDK with official configuration
        async initialize() {
          try {
            console.log('🚀 Initializing Official Pi SDK...');
            
            if (!window.Pi) {
              console.error('❌ Pi SDK not available');
              return false;
            }
            
            await window.Pi.init(this.config);
            console.log('✅ Official Pi SDK initialized');
            return true;
            
          } catch (error) {
            console.error('❌ Error initializing Official Pi SDK:', error);
            return false;
          }
        },
        
        // Create payment using official Pi SDK
        async createPayment(paymentData) {
          try {
            console.log('💳 Creating payment with official Pi SDK:', paymentData);
            
            const payment = await window.Pi.createPayment({
              amount: paymentData.amount,
              memo: paymentData.memo,
              metadata: paymentData.metadata || {},
              // Official Pi SDK payment options
              network: 'mainnet',
              testnet: false,
              sandbox: true
            });
            
            console.log('✅ Payment created successfully:', payment);
            return { success: true, payment };
            
          } catch (error) {
            console.error('❌ Error creating payment:', error);
            return { success: false, error: error.message };
          }
        }
      };
      
      // Auto-initialize when Pi SDK is loaded
      window.addEventListener('load', () => {
        if (window.Pi) {
          window.PiOfficialSDK.initialize();
        }
      });
    </script>
    
    <script>
      // Enhanced Pi SDK initialization for Pi Network subdomains
      (function() {
        try {
          console.log('🚀 Initializing Pi SDK for Flappy Pi...');
          
           // Detect environment
           const hostname = window.location.hostname;
           const isPiNetworkSubdomain = hostname.includes('.pinet.com') || 
                                      hostname.includes('.minepi.com') ||
                                      hostname === 'flappypi2807.pinet.com' ||
                                      hostname === 'flappypi.fun' ||
                                      hostname === 'flappypi.fun';
          const isPiBrowser = typeof window !== 'undefined' && 
                             (window.navigator.userAgent.includes('PiBrowser') || 
                              window.navigator.userAgent.includes('PiNetwork'));
          
          console.log('🌐 Environment detection:', {
            hostname: hostname,
            isPiNetworkSubdomain: isPiNetworkSubdomain,
            isPiBrowser: isPiBrowser,
            userAgent: window.navigator.userAgent.substring(0, 100)
          });
          
          // FORCE SANDBOX MODE - SANDBOX ENABLED
          let sandboxMode = true; // ALWAYS SANDBOX - SANDBOX ENABLED
          
          // Check if user is accessing via sandbox URL and warn them
          if (hostname.includes('sandbox.minepi.com')) {
            console.warn('⚠️ SANDBOX URL DETECTED - Using mainnet mode anyway');
            console.warn('⚠️ For best experience, use: https://minepi.com/app/flappy-pi-9cdac3f5c9a42c36');
          }
          
          console.log('🔧 FORCED MAINNET MODE - Sandbox detection disabled');
          
                     // Initialize Pi SDK with MAINNET configuration
           const initConfig = {
             version: "2.0",
             sandbox: true, // FORCED SANDBOX - SANDBOX ENABLED
             appId: "flappypi2807",
             network: "mainnet", // EXPLICIT MAINNET
             environment: "production" // PRODUCTION ENVIRONMENT
           };
          
          console.log('🔧 Pi SDK initialization config:', initConfig);
          
          // Init Pi SDK:
          Pi.init(initConfig).then(() => {
            console.log('✅ Pi SDK initialized successfully for MAINNET!');
            console.log('🔧 Sandbox mode: DISABLED (Mainnet)');
            console.log('🌐 Environment: MAINNET PRODUCTION');
            console.log('🔧 Network: mainnet');
            console.log('🔧 Environment: production');
            
            // Make Pi globally available
            window.Pi = Pi;
            
            // Dispatch custom event for app to know SDK is ready
            window.dispatchEvent(new CustomEvent('pi-sdk-ready', {
              detail: {
                sandbox: sandboxMode,
                isPiNetworkSubdomain: isPiNetworkSubdomain,
                isPiBrowser: isPiBrowser
              }
            }));
            
          }).catch((error) => {
            console.error('❌ Pi SDK initialization failed:', error);
            
            // Create fallback for non-Pi environments (MAINNET)
            if (!isPiNetworkSubdomain && !isPiBrowser) {
              console.warn('⚠️ Creating fallback Pi SDK for non-Pi environment (MAINNET)');
              window.Pi = {
                init: async (config) => {
                  console.log('✅ Fallback Pi SDK initialized for MAINNET:', config);
                  return Promise.resolve();
                },
                authenticate: async (scopes) => {
                  console.log('🔐 Fallback authentication called with scopes (MAINNET):', scopes);
                  return Promise.resolve({ 
                    user: { uid: 'mainnet-user', username: 'MainnetUser' },
                    accessToken: 'mainnet-token'
                  });
                },
                currentUser: () => {
                  return { uid: 'mainnet-user', username: 'MainnetUser' };
                },
                isPiBrowser: () => false,
                isAuthenticated: () => false
              };
            }
          });
          
        } catch (error) {
          console.error('❌ Pi SDK setup failed:', error);
        }
      })();
    </script>
