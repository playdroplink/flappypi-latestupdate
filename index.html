<body>
    <div id="root"></div>
    
    <!-- Socket.IO Client for Multiplayer -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <!-- Pi Network SDK - PRODUCTION MAINNET -->
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script>
        // Pi Network SDK Initialization for PRODUCTION MAINNET
        // NO SANDBOX - NO TESTNET - PRODUCTION ONLY
        (function() {
            try {
                console.log('🚀 Initializing Pi Network SDK for Flappy Pi PRODUCTION MAINNET...');
                
                // Check if Pi SDK is available
                if (typeof Pi === 'undefined') {
                    console.error('❌ Pi SDK not loaded - please ensure you are in Pi Browser');
                    return;
                }
                
                // Initialize Pi SDK for MAINNET PRODUCTION
                Pi.init({ 
                    version: "2.0",
                    sandbox: false, // MAINNET: PRODUCTION MODE
                    validationKey: '94e29cc9c70b87c8fc91e496ac630d23664bff7082cca3ad9d6466bba1aa2902caa46a8eb82a64437d272dbcd329c763679c85cfcba91b95e6fb5b4a6f17b2ce'
                }).then(() => {
                    console.log('✅ Pi Network SDK initialized successfully for MAINNET PRODUCTION!');
                    console.log('🔧 Network Mode: Mainnet (Production)');
                    console.log('🎮 App: Flappy Pi');
                    console.log('🔗 Subdomain: flappypi2807.pinet.com');
                    console.log('🏭 Production Mode: ENABLED');
                    console.log('🌐 Mainnet Mode: ENABLED');
                
                    
                    // Dispatch ready event
                    window.dispatchEvent(new CustomEvent('pi-sdk-ready'));
                    
                    // Make Pi globally available
                    window.Pi = Pi;
                    
                    // Log SDK methods for debugging
                    console.log('📋 Available Pi SDK methods:', Object.keys(Pi));
                    
                    // Log available native features
                    Pi.nativeFeaturesList().then(features => {
                        console.log('📱 Available native features:', features);
                    }).catch(err => {
                        console.warn('⚠️ Could not get native features list:', err);
                    });
                }).catch((error) => {
                    console.error('❌ Pi Network SDK initialization failed:', error);
                    
                    // Show error message to user
                    if (typeof window !== 'undefined') {
                        alert('Failed to initialize Pi Network SDK. Please ensure you are using Pi Browser.');
                    }
                });
            } catch (error) {
                console.error('❌ Pi Network SDK setup failed:', error);
            }
        })();
    </script>
    
    <!-- Production Verification -->
    <script>
        // Verify production configuration on page load
        window.addEventListener('load', function() {
            console.log('🔍 Verifying Flappy Pi Production Configuration...');
            
            // Check if we're in mainnet mode
            const isProduction = window.FLAPPY_PI_CONFIG.production === true;
            const isMainnet = window.FLAPPY_PI_CONFIG.mainnet === true;
            const isSandbox = window.FLAPPY_PI_CONFIG.sandbox === true;
            
            if (isProduction && isMainnet && isSandbox) {
                console.log('🎉 MAINNET VERIFICATION PASSED!');
                console.log('✅ Flappy Pi is configured for MAINNET PRODUCTION');
                console.log('✅ Mainnet access enabled');
                console.log('✅ Ready for production on Pi Network mainnet');
            } else {
                console.error('🚨 MAINNET VERIFICATION FAILED!');
                console.error('❌ Flappy Pi is NOT in mainnet mode');
                console.error('❌ Please check configuration for mainnet setup');
            }
        });
    </script>
